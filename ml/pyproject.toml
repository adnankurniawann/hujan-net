[project]
name = "hujannet-ml"
version = "0.1.0"
description = "Pipeline data dan model AI HujanNet"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "netcdf4",
    "h5py",
    "poligrain",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
